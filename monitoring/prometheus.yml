global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'carecompanion-prod'
    static_configs:
      - targets: ['carecompanion-prod:3000']
    metrics_path: '/metrics'

  - job_name: 'carecompanion-staging'
    static_configs:
      - targets: ['carecompanion-staging:3001']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
